# Миграции схемы БД. URL берётся из DATABASE_URL (.env), здесь его нет.
#
#   alembic upgrade head                           — применить миграции
#   alembic revision --autogenerate -m "описание"  — создать миграцию после правки models.py
#
# Бот сам применяет миграции при запуске (bot/database/migrate.py).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
